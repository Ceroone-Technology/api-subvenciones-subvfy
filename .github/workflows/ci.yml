name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: subvfy
          POSTGRES_PASSWORD: subvfy
          POSTGRES_DB: subvfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://subvfy:subvfy@localhost:5432/subvfy
      # Explícitos: sin ENVIRONMENT la API se trataría como production y
      # rechazaría este secreto, que es público (está en este archivo).
      ENVIRONMENT: development
      DATABASE_ECHO: "false"
      JWT_SECRET_KEY: ci-only-inseguro-no-usar-fuera-del-ci-000000000000
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      CORS_ORIGINS: http://localhost:4200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Migraciones (alembic upgrade head)
        run: python -m alembic upgrade head

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy app

      - name: pytest
        run: python -m pytest -q

      # Informativo: un aviso publicado hoy no debe parar un PR que no lo ha
      # causado. El paso sale en rojo, pero el job sigue en verde, y el
      # resultado queda en el resumen del job.
      - name: pip-audit (informativo)
        continue-on-error: true
        run: |
          python -m venv /tmp/pip-audit
          /tmp/pip-audit/bin/pip install --quiet pip-audit==2.10.1
          set +e
          salida=$(/tmp/pip-audit/bin/pip-audit -r requirements-dev.txt 2>&1)
          codigo=$?
          set -e
          echo "$salida"
          {
            echo "## pip-audit (requirements-dev.txt, incluye requirements.txt)"
            echo
            echo '```'
            echo "$salida"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $codigo
